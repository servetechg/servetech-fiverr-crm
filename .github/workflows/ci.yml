name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/servetech_crm
          AUTH_SECRET: ci-build-secret-minimum-32-characters-long
          AUTH_URL: http://localhost:3000
